<style>
/* Layout: one candlelit stage, a gilt-edged card floating in the centre, contact line beneath. */
:root {
  --night: #120d0b;
  --ember: #3a1418;
  --glow: rgba(201, 150, 82, 0.20);
  --wine: #5e1a24;
  --wine-deep: #3e0f17;
  --gilt: #c9a35b;
  --gilt-soft: #e3c58a;
  --paper: #f6efe4;
  --ink: #2a1e1a;
  --mute: #b9a796;
  --display: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
  --body: 'Jost', 'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif;
  --cw: min(86vw, 540px);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  overflow-x: hidden;
}
.stage {
  min-height: 100%;
  box-sizing: border-box;
  padding-inline: 16px;
  padding-block: 40px 32px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
  background:
    radial-gradient(60% 50% at 50% 46%, var(--glow), transparent 70%),
    radial-gradient(90% 70% at 50% 120%, var(--ember), transparent 70%),
    var(--night);
}
.eyebrow {
  margin: 0; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--gilt);
}
.scene {
  width: var(--cw); max-width: 100%;
  aspect-ratio: 1.545; perspective: 1400px;
  position: relative; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.scene:active { cursor: grabbing; }
.scene:focus-visible { outline: 1px solid var(--gilt); outline-offset: 14px; border-radius: 18px; }
.shadow {
  position: absolute; left: 10%; right: 10%; bottom: -16%; height: 14%;
  background: radial-gradient(closest-side, rgba(0,0,0,.65), transparent);
  filter: blur(6px); transform: scaleX(var(--sh, 1)); pointer-events: none;
}
.card {
  position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform;
}
.face, .edge {
  position: absolute; inset: 0; border-radius: calc(var(--cw) * .032);
}
.edge { background: linear-gradient(135deg, #8a6a32, var(--gilt-soft) 45%, #9a7638); }
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }

.sheen {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: linear-gradient(calc(110deg + var(--sa, 0deg)), transparent 30%, rgba(255,246,225,.75) var(--sp, 50%), transparent 70%);
}
.frame {
  position: absolute; inset: 5.5%; border: 1px solid rgba(201,163,91,.55); border-radius: calc(var(--cw) * .014); pointer-events: none;
}
.front-text {
  position: absolute; top: 0; bottom: 0; left: 38%; right: 6%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  gap: calc(var(--cw) * .022);
}
.mark {
  margin: 0; font-family: var(--display); font-weight: 500; color: var(--wine);
  font-size: calc(var(--cw) * .135); letter-spacing: .06em; line-height: 1;
  padding-left: .06em;
}
.rule { display: flex; align-items: center; gap: calc(var(--cw) * .014); width: 62%; }
.rule span { flex: 1; height: 1px; background: var(--gilt); }
.rule i { width: calc(var(--cw) * .011); height: calc(var(--cw) * .011); background: var(--gilt); transform: rotate(45deg); }
.line {
  margin: 0; font-family: var(--display); font-style: italic; color: #6a5248;
  font-size: calc(var(--cw) * .05); line-height: 1.1;
}
.tag {
  margin: 0; font-size: calc(var(--cw) * .021); letter-spacing: .34em; text-transform: uppercase; color: #9a7638; padding-left: .34em;
}
.back-text {
  position: absolute; inset: 0; z-index: 1;
  display: grid; grid-template-columns: auto 1fr; align-items: center;
  padding: 11% 11%; gap: 0 9%;
}
.seal {
  font-family: var(--display); font-size: calc(var(--cw) * .085); color: var(--gilt-soft); line-height: 1;
  writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .14em;
  border-left: 1px solid rgba(227,197,138,.5); padding-left: calc(var(--cw) * .03);
}
.contacts { display: flex; flex-direction: column; gap: calc(var(--cw) * .036); min-width: 0; }
.row { display: flex; flex-direction: column; gap: calc(var(--cw) * .006); }
.row b {
  font-weight: 500; font-size: calc(var(--cw) * .02); letter-spacing: .3em; text-transform: uppercase; color: var(--gilt-soft);
}
.row span, .row a {
  font-family: var(--display); font-size: calc(var(--cw) * .052); line-height: 1.05; color: var(--paper);
  text-decoration: none; font-variant-numeric: lining-nums; overflow-wrap: anywhere;
}
.row a { border-bottom: 1px solid rgba(227,197,138,.45); align-self: flex-start; }
.hint { margin: 0; font-size: 13px; color: var(--mute); letter-spacing: .04em; text-align: center; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
button {
  font: 500 12px/1 var(--body); letter-spacing: .18em; text-transform: uppercase;
  color: var(--paper); background: transparent; border: 1px solid rgba(201,163,91,.55);
  padding: 12px 18px; border-radius: 999px; cursor: pointer;
}
button:hover { background: rgba(201,163,91,.12); }
button:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }
.status { min-height: 18px; margin: 0; font-size: 13px; color: var(--gilt-soft); text-align: center; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
<style>body{margin:0}</style>
</head>
<body>


<main class="stage">
  <p class="eyebrow">Rensé · A private transformation</p>

  <div class="scene" id="scene" tabindex="0" role="img" aria-label="RENSÉ business card. Front: RENSÉ, Guided Healing Journal. Back: email hello@rense.se, phone +46 73-097 44 23, website rense.se. Drag to rotate, press Enter to flip.">
    <div class="shadow" id="shadow"></div>
    <div class="card" id="card">
      <div class="edge" style="transform:translateZ(-2px)"></div>
      <div class="edge" style="transform:translateZ(-1.2px)"></div>
      <div class="edge" style="transform:translateZ(-0.4px)"></div>
      <div class="edge" style="transform:translateZ(0.4px)"></div>
      <div class="edge" style="transform:translateZ(1.2px)"></div>
      <div class="edge" style="transform:translateZ(2px)"></div>

      <div class="face front">
        <div class="frame"></div>
        <div class="front-text">
          <p class="mark">RENSÉ</p>
          <div class="rule"><span></span><i></i><span></span></div>
          <p class="line">Guided Healing Journal</p>
          <p class="tag">A private transformation</p>
        </div>
        <div class="sheen"></div>
      </div>

      <div class="face back">
        <div class="frame"></div>
        <div class="back-text">
          <div class="seal">RENSÉ</div>
          <div class="contacts">
            <div class="row"><b>Email</b><span>hello@rense.se</span></div>
            <div class="row"><b>Nr</b><span>+46 73-097 44 23</span></div>
            <div class="row"><b>Website</b><a href="https://rense.se" target="_blank" rel="noopener" data-link>rense.se</a></div>
          </div>
        </div>
        <div class="sheen"></div>
      </div>
    </div>
  </div>

  <p class="hint">Hold and drag to turn the card. Tap to flip it.</p>

  <div class="controls">
    <button type="button" id="flip">Turn card</button>
    <button type="button" data-copy="hello@rense.se">Copy email</button>
    <button type="button" data-copy="+46 73-097 44 23">Copy number</button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  var scene = document.getElementById('scene');
  var card = document.getElementById('card');
  var shadow = document.getElementById('shadow');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var rx = -8, ry = -18, vx = 0, vy = 0;
  var dragging = false, moved = 0, lastX = 0, lastY = 0, lastT = 0, startTarget = null;
  var settleY = null, t0 = performance.now();

  function render(now) {
    var sway = (!dragging && !reduce) ? Math.sin((now - t0) / 1600) * 3 : 0;
    var swayX = (!dragging && !reduce) ? Math.cos((now - t0) / 2100) * 2 : 0;
    var X = rx + swayX, Y = ry + sway;
    card.style.transform = 'rotateX(' + X + 'deg) rotateY(' + Y + 'deg)';
    var yn = ((Y % 360) + 360) % 360;
    var facing = Math.abs(Math.cos(Y * Math.PI / 180));
    shadow.style.setProperty('--sh', (0.55 + 0.45 * facing).toFixed(3));
    var sp = 50 + Math.sin(Y * Math.PI / 180) * 40 + X * 0.6;
    card.style.setProperty('--sp', sp.toFixed(1) + '%');
    card.style.setProperty('--sa', (X * 0.8).toFixed(1) + 'deg');
  }

  function nearestFace(y) { return Math.round(y / 180) * 180; }

  function tick(now) {
    if (!dragging) {
      if (Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02) {
        ry += vy; rx += vx;
        vy *= 0.95; vx *= 0.95;
        rx = Math.max(-75, Math.min(75, rx));
      } else {
        vx = vy = 0;
        var target = settleY !== null ? settleY : nearestFace(ry) - 18;
        ry += (target - ry) * 0.06;
        rx += (-8 - rx) * 0.06;
        if (settleY !== null && Math.abs(target - ry) < 0.3) settleY = null;
      }
    }
    render(now);
    requestAnimationFrame(tick);
  }

  scene.addEventListener('pointerdown', function (e) {
    dragging = true; moved = 0; settleY = null;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    startTarget = e.target; vx = vy = 0;
    try { scene.setPointerCapture(e.pointerId); } catch (err) {}
  });
  scene.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var now = performance.now();
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    var dt = Math.max(1, now - lastT);
    moved += Math.abs(dx) + Math.abs(dy);
    ry += dx * 0.45; rx -= dy * 0.45;
    rx = Math.max(-75, Math.min(75, rx));
    vy = dx * 0.45 * (16 / dt); vx = -dy * 0.45 * (16 / dt);
    lastX = e.clientX; lastY = e.clientY; lastT = now;
  });
  function end(e) {
    if (!dragging) return;
    dragging = false;
    if (performance.now() - lastT > 80) { vx = vy = 0; }
    if (reduce) { vx = vy = 0; }
    if (moved < 6) {
      var link = startTarget && startTarget.closest && startTarget.closest('[data-link]');
      if (link) { window.open(link.href, '_blank', 'noopener') || (location.href = link.href); return; }
      flip();
    }
  }
  scene.addEventListener('pointerup', end);
  scene.addEventListener('pointercancel', end);
  scene.addEventListener('click', function (e) {
    var link = e.target.closest && e.target.closest('[data-link]');
    if (link) e.preventDefault();
  });

  function flip() { vx = vy = 0; settleY = nearestFace(ry) + 180; }
  document.getElementById('flip').addEventListener('click', flip);
  scene.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    if (e.key === 'ArrowLeft') ry -= 15;
    if (e.key === 'ArrowRight') ry += 15;
    if (e.key === 'ArrowUp') rx = Math.min(75, rx + 10);
    if (e.key === 'ArrowDown') rx = Math.max(-75, rx - 10);
  });

  var status = document.getElementById('status');
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var text = b.getAttribute('data-copy');
      var done = function () { status.textContent = 'Copied ' + text; };
      var fail = function () { status.textContent = 'Select and copy: ' + text; };
      try { navigator.clipboard.writeText(text).then(done, fail); } catch (err) { fail(); }
    });
  });

  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
